<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan curves</title>
<style>
  * { box-sizing: border-box }
  body { max-width: 920px; margin: 40px auto; padding: 0 20px; background: #f6f7f9; color: #202936; font: 15px system-ui }
  p { color: #657080 }
  form { display: flex; flex-wrap: wrap; gap: 16px; margin: 24px 0 }
  fieldset { border: 1px solid #d5dae2; border-radius: 8px; padding: 12px }
  label { display: inline-flex; align-items: center; gap: 6px }
  input { width: 85px; padding: 7px; border: 1px solid #c4cbd6; border-radius: 4px; font: inherit }
  canvas { display: block; width: 100%; height: 480px; background: white; border: 1px solid #d5dae2; border-radius: 10px }
  table { width: 100%; border-collapse: collapse; background: white; font-variant-numeric: tabular-nums }
  caption { text-align: left; padding: 12px 0; color: #657080 }
  th, td { padding: 10px 14px; border-bottom: 1px solid #d5dae2; text-align: right }
  th:first-child, td:first-child { text-align: left }
</style>
<form>
  <fieldset><legend>Start</legend>
    <label>X <input id="sx" type="number" step="any" value="40" required></label>
    <label>Y <input id="sy" type="number" step="any" value="20" required></label>
  </fieldset>
  <fieldset><legend>End</legend>
    <label>X <input id="ex" type="number" step="any" value="85" required></label>
    <label>Y <input id="ey" type="number" step="any" value="100" required></label>
  </fieldset>
  <fieldset><legend>Density</legend>
    <label>Steps <input id="steps" type="number" min="1" max="1000" step="1" value="8" required></label>
  </fieldset>
</form>
<canvas aria-label="Fan lines and their envelope curve; X increases right, Y increases up."></canvas>
<table>
  <caption>
    <label>Decimal places <input id="decimals" type="number" min="0" max="10" step="1" value="1" required></label>
  </caption>
  <thead><tr><th scope="col">Point</th><th scope="col">X</th><th scope="col">Y</th></tr></thead>
  <tbody></tbody>
</table>
<script>
  const form = document.querySelector("form");
  const canvas = document.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const rows = document.querySelector("tbody");
  const decimals = document.querySelector("#decimals");
  function draw() {
    rows.replaceChildren();
    const w = canvas.clientWidth,
      h = canvas.clientHeight,
      dpr = devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    if (!form.checkValidity()) return;
    const [sx, sy, ex, ey, steps] = [...form.querySelectorAll("input")].map(
      (el) => el.valueAsNumber,
    );
    const dx = ex - sx,
      dy = ey - sy;
    if (![dx, dy].every(Number.isFinite)) return;
    const scale = Math.min(
      (w - 90) / (Math.abs(dx) || 1),
      (h - 90) / (Math.abs(dy) || 1),
    );
    const point = (x, y) => [
      w / 2 + (x - dx / 2) * scale,
      h / 2 - (y - dy / 2) * scale,
    ];
    const a = point(0, 0),
      b = point(dx, dy),
      corner = point(dx, 0);
    ctx.strokeStyle = "#cdd3dd";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(...a);
    ctx.lineTo(...corner);
    ctx.lineTo(...b);
    ctx.stroke();
    // Slide both ends along the two legs. Their envelope is a quadratic Bezier.
    ctx.strokeStyle = "#6599c380";
    ctx.beginPath();
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      ctx.moveTo(...point(dx * t, 0));
      ctx.lineTo(...point(dx, dy * t));
    }
    ctx.stroke();
    ctx.strokeStyle = "#1664ac";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(...a);
    ctx.quadraticCurveTo(...corner, ...b);
    ctx.stroke();
    ctx.font = "12px system-ui";
    ctx.textAlign = "center";
    ctx.fillStyle = "#202936";
    for (const [p, label] of [
      [a, `Start (${sx}, ${sy})`],
      [b, `End (${ex}, ${ey})`],
    ]) {
      ctx.beginPath();
      ctx.arc(...p, 4, 0, Math.PI * 2);
      ctx.fill();
      const x = Math.max(
        ctx.measureText(label).width / 2 + 5,
        Math.min(w - ctx.measureText(label).width / 2 - 5, p[0]),
      );
      ctx.fillText(label, x, p[1] < h / 2 ? p[1] - 14 : p[1] + 22);
    }
    const points = [
      { label: "Start", x: sx, y: sy },
      { label: "End", x: ex, y: ey },
    ];
    // Adjacent interior strings intersect at (t + u - tu, tu) in unit coordinates.
    if (dx && dy)
      for (let i = 1; i < steps - 1; i++) {
        const t = i / steps,
          u = (i + 1) / steps;
        points.push({
          label: "Intersection",
          x: sx + dx * (t + u - t * u),
          y: sy + dy * t * u,
        });
      }
    points.sort((a, b) => a.x - b.x || a.y - b.y);
    if (!decimals.checkValidity()) return;
    let number = 0;
    for (const p of points) {
      const row = rows.insertRow();
      for (const value of [
        p.label === "Intersection" ? `Intersection ${++number}` : p.label,
        p.x,
        p.y,
      ]) {
        row.insertCell().textContent =
          typeof value === "number"
            ? value.toFixed(decimals.valueAsNumber)
            : value;
      }
    }
  }
  form.addEventListener("submit", (event) => event.preventDefault());
  form.addEventListener("input", draw);
  decimals.addEventListener("input", draw);
  new ResizeObserver(draw).observe(canvas);
</script>
</html>
